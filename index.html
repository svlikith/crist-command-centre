<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRIST AI — Command Centre</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050912">
<style>
:root{--bg:#04070E;--bg2:#08101E;--panel:rgba(12,20,36,.78);--line:rgba(120,170,230,.16);--blue:#2CC4FF;--blue2:#0A84FF;
--ti:#A9B6C9;--mu:#6B7A90;--tx:#F4F8FD;--ok:#34D399;--bad:#F87171;--r:16px;--pad:16px}
body.compact{--pad:11px;--r:12px}
body.calm *{animation:none!important;transition:none!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;
background:radial-gradient(1000px 500px at 85% -10%,rgba(44,196,255,.13),transparent 60%),radial-gradient(800px 500px at -10% 30%,rgba(10,132,255,.1),transparent 60%),var(--bg);background-attachment:fixed}
#bgc{position:fixed;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none}
button{font:inherit;font-weight:600;color:inherit;background:none;border:0;cursor:pointer;transition:.15s}
button:active{transform:scale(.97)}
input,select,textarea{font:inherit;font-size:16px;width:100%;color:var(--tx);background:#071022;border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:0;margin-bottom:9px}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(44,196,255,.13)}
input[type=checkbox]{width:20px;height:20px;margin:0;accent-color:var(--blue)}
/* boot */
#boot{position:fixed;inset:0;z-index:9999;background:#03060C;display:grid;place-content:center;justify-items:center;gap:16px;transition:opacity .6s,visibility .6s}
#boot.off{opacity:0;visibility:hidden}
.bl{font-size:2.1rem;font-weight:900;letter-spacing:.4em;padding-left:.4em;background:linear-gradient(90deg,#fff,var(--blue));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.bb{width:210px;height:3px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}.bb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue2),var(--blue));animation:ld 1.6s forwards}
@keyframes ld{to{width:100%}}@keyframes pl{50%{opacity:.5}}
.bt{font:.68rem ui-monospace,Menlo,monospace;color:var(--ti);letter-spacing:.14em}
/* layout */
#app{display:grid;grid-template-columns:1fr;min-height:100vh}
aside{display:none}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:rgba(4,7,14,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.brand{font-weight:900;letter-spacing:.2em;font-size:.95rem;background:linear-gradient(90deg,#fff,var(--blue));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sp{flex:1}.brand{white-space:nowrap}
@media(max-width:480px){#stx{display:none}.stage{font-size:.52rem;padding:3px 6px}.top{gap:8px}}
.ib{position:relative;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);display:grid;place-content:center;font-size:1.05rem}
.bdg{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--blue);color:#021;font-size:.65rem;font-weight:800;display:grid;place-content:center;padding:0 5px}
.st{display:flex;align-items:center;gap:6px;font-size:.66rem;color:var(--ti)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mu)}.dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pl 1.8s infinite}.dot.off{background:var(--bad)}
.stage{font-size:.58rem;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:99px;color:var(--blue);border:1px solid rgba(44,196,255,.4);text-transform:uppercase;white-space:nowrap}
main{padding:16px 14px calc(env(safe-area-inset-bottom) + 96px);max-width:1100px;width:100%;margin:0 auto}
.view{animation:in .3s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}}
h2{font-size:1.35rem;font-weight:800;letter-spacing:.01em}
.sub{color:var(--ti);font-size:.82rem;margin:2px 0 14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);margin-bottom:12px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--blue),transparent);opacity:.45}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:.72rem;color:var(--ti);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.m{background:rgba(20,34,58,.55);border:1px solid var(--line);border-radius:14px;padding:12px}
.m small{font-size:.6rem;color:var(--ti);letter-spacing:.08em;text-transform:uppercase}
.m b{display:block;font-size:1.55rem;margin-top:2px;background:linear-gradient(90deg,#fff,var(--blue));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tag{display:inline-block;font-size:.58rem;font-weight:800;letter-spacing:.05em;padding:2px 7px;border-radius:5px;text-transform:uppercase;white-space:nowrap}
.t-fact{background:rgba(52,211,153,.14);color:var(--ok)}.t-assumption{background:rgba(169,182,201,.16);color:var(--ti)}
.t-estimate{background:rgba(44,196,255,.15);color:var(--blue)}.t-recommendation{background:transparent;border:1px solid var(--blue);color:var(--tx)}
.t-idea{background:rgba(255,255,255,.08);color:var(--tx)}.t-risk{background:rgba(248,113,113,.14);color:var(--bad)}.t-ai{background:rgba(10,132,255,.2);color:#8FD0FF}
.row{padding:11px 12px;background:rgba(6,12,24,.6);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.rh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-size:.9rem}
.rd{font-size:.8rem;color:var(--ti);margin-top:3px;white-space:pre-wrap;word-wrap:break-word}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{padding:11px 16px;border-radius:12px;font-size:.84rem;color:#02111c;background:linear-gradient(135deg,var(--blue),var(--blue2));box-shadow:0 6px 22px rgba(10,132,255,.28)}
.btn:disabled{opacity:.5}
.b2{padding:8px 12px;border-radius:10px;font-size:.76rem;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.ok{padding:7px 12px;border-radius:9px;font-size:.75rem;background:rgba(52,211,153,.14);border:1px solid var(--ok);color:var(--ok)}
.no{padding:7px 12px;border-radius:9px;font-size:.75rem;background:rgba(248,113,113,.12);border:1px solid var(--bad);color:var(--bad)}
.banner{border-left:3px solid var(--blue);background:rgba(44,196,255,.06);padding:10px 12px;border-radius:8px;font-size:.76rem;color:var(--ti);margin-bottom:12px}
.empty{padding:22px;text-align:center;color:var(--mu);font-size:.85rem;border:1px dashed var(--line);border-radius:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;font-size:.72rem;padding:7px 13px;border-radius:20px;color:var(--blue);background:rgba(44,196,255,.07);border:1px solid rgba(44,196,255,.3)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:96px 1fr 34px;align-items:center;gap:8px;font-size:.76rem;color:var(--ti)}
.bar i{display:block;height:9px;border-radius:5px;background:linear-gradient(90deg,var(--blue2),var(--blue));transition:width .7s;min-width:2px}
.bar div{background:rgba(255,255,255,.06);border-radius:5px;overflow:hidden}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--blue) calc(var(--p)*1%),rgba(255,255,255,.08) 0);display:grid;place-content:center;position:relative;flex-shrink:0}
.ring:after{content:"";position:absolute;inset:8px;border-radius:50%;background:#070e1c}.ring b{position:relative;z-index:1;font-size:1.15rem}
.flex{display:flex;gap:12px;align-items:center}
.tl{position:relative;padding-left:22px}.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:linear-gradient(var(--blue),transparent)}
.ts{position:relative;margin-bottom:12px;font-size:.85rem}.ts:before{content:"";position:absolute;left:-21px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--mu)}
.ts.now:before{background:var(--blue);border-color:var(--blue);box-shadow:0 0 12px var(--blue)}.ts small{display:block;color:var(--mu);font-size:.7rem}
.kan{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.chk{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.05);font-size:.85rem}
.chk.d span{text-decoration:line-through;color:var(--mu)}
/* chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 470px);min-height:300px}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 0 10px}
.b{max-width:90%;padding:11px 14px;border-radius:16px;font-size:.88rem;word-wrap:break-word;user-select:text;-webkit-user-select:text}
.b.u{align-self:flex-end;background:linear-gradient(135deg,#0A84FF,#1D6FCC);border-bottom-right-radius:4px;white-space:pre-wrap}
.b.a{align-self:flex-start;background:rgba(12,22,40,.95);border:1px solid var(--line);border-bottom-left-radius:4px}
.md p{margin:3px 0}.md ul{margin:5px 0 5px 18px}.md h4{margin:8px 0 3px;color:var(--blue);font-size:.85rem}
.ty span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--blue);animation:bn 1s infinite}.ty span:nth-child(2){animation-delay:.15s}.ty span:nth-child(3){animation-delay:.3s}
@keyframes bn{50%{transform:translateY(-5px);opacity:.4}}
.cb{display:flex;gap:8px;align-items:center}.cb input{margin:0}
.send{flex-shrink:0;height:44px;padding:0 16px;border-radius:12px;color:#02111c;background:linear-gradient(135deg,var(--blue),var(--blue2))}
.mic{flex-shrink:0;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line)}.mic.rec{background:rgba(248,113,113,.25);border-color:var(--bad)}
/* nav */
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;padding:8px 6px calc(env(safe-area-inset-bottom) + 6px);background:rgba(4,7,14,.86);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--line)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.6rem;color:var(--ti)}.nb i{font-style:normal;font-size:1.2rem;opacity:.7}.nb.act{color:var(--blue)}.nb.act i{opacity:1;text-shadow:0 0 12px var(--blue)}
/* overlays */
.ov{position:fixed;inset:0;z-index:200;background:rgba(2,5,10,.74);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:88vh;overflow-y:auto;background:#0A1424;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.pal{align-items:flex-start;padding-top:12vh}.pal .sheet{border-radius:18px;max-height:70vh}
.mi{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:10px;width:100%;text-align:left;font-weight:500}.mi:hover,.mi.sel{background:rgba(44,196,255,.1)}.mi small{color:var(--mu);margin-left:auto}
.gl{font-size:.62rem;color:var(--mu);letter-spacing:.14em;text-transform:uppercase;margin:12px 4px 4px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 86px);transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:6px;align-items:center}
.tt{background:#0E1D34;border:1px solid var(--blue);padding:9px 16px;border-radius:12px;font-size:.8rem;animation:in .25s}
@media(min-width:900px){
#app{grid-template-columns:250px 1fr}
aside{display:block;position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 12px;border-right:1px solid var(--line);background:rgba(4,7,14,.55)}
aside .brand{display:block;padding:0 8px 14px;font-size:1.05rem}
nav.bot{display:none}main{padding-bottom:40px}.sheet{border-radius:22px;margin-bottom:6vh}.ov{align-items:center}.pal{align-items:flex-start}
.chat{height:calc(100vh - 330px);min-height:360px}}
</style>
</head>
<body>
<canvas id="bgc"></canvas>
<div id="boot"><div class="bl">CRIST AI</div><div class="bb"><i></i></div><div class="bt" id="btx">INITIALISING COMMAND CENTRE…</div></div>
<div id="app">
  <aside id="side"></aside>
  <div>
    <div class="top">
      <div class="brand">CRIST AI</div><span class="stage">Phase 0 · Concept</span>
      <div class="sp"></div>
      <div class="st"><span class="dot" id="dot"></span><span id="stx">…</span></div>
      <button class="ib" id="bSearch" aria-label="Search">🔍</button>
      <button class="ib" id="bBell" aria-label="Notifications">🔔<span class="bdg" id="bdg" style="display:none">0</span></button>
    </div>
    <main id="main"></main>
  </div>
</div>
<nav class="bot" id="bot"></nav>
<div id="toast"></div>

<script>
"use strict";
/* ============ CONFIG ============ */
const DEFAULT_API="https://crist-ai-v2.svlikith56.workers.dev";
const KEY="crist_cc_v3", MAXMSG=1900;

/* ============ HELPERS ============ */
const $=(s,r=document)=>r.querySelector(s);
function h(t,a,...c){const e=document.createElement(t);
 if(a)for(const k in a){const v=a[k];if(v==null||v===false)continue;
  if(k==="class")e.className=v;else if(k==="value")e.value=v;else if(k==="checked")e.checked=!!v;
  else if(k.startsWith("on"))e[k]=v;else e.setAttribute(k,v===true?"":v)}
 c.flat(9).forEach(x=>{if(x==null||x===false)return;e.append(x.nodeType?x:document.createTextNode(String(x)))});return e}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const fmt=n=>Number(n||0).toLocaleString("en-IN");
function toast(m){const t=h("div",{class:"tt"},m);$("#toast").append(t);setTimeout(()=>t.remove(),2600)}
function tagEl(t){return h("span",{class:"tag t-"+String(t).toLowerCase().replace(/\s+/g,"")},t)}

/* ============ STATE ============ */
const DEF=()=>({user:"Founder",api:DEFAULT_API,compact:false,calm:false,
 tasks:[{id:uid(),title:"Define CRIST GT-01 target customer",pri:"High",due:"",done:false,tag:"Recommendation"},
        {id:uid(),title:"Write GT-01 requirements document",pri:"High",due:"",done:false,tag:"Recommendation"},
        {id:uid(),title:"List 10 possible technical advisors",pri:"Medium",due:"",done:false,tag:"Idea"}],
 projects:[{id:uid(),title:"CRIST brand identity",st:"Active",pct:20},{id:uid(),title:"GT-01 concept brief",st:"Planned",pct:0},{id:uid(),title:"Founder website",st:"Active",pct:60}],
 approvals:[],decisions:[],records:{},logs:[{t:Date.now(),m:"Command centre initialised in Concept-Only mode."}],
 chats:{},swot:{s:"",w:"",o:"",t:""},
 gt:{fields:{},checks:{}},inv:{checks:{}},
 fin:{cash:0,burn:0,lines:[]},
 facts:[{id:uid(),k:"Company stage",v:"Early-stage concept. No prototype, factory or confirmed funding.",tag:"Fact"},
        {id:uid(),k:"Flagship concept",v:"CRIST GT-01, a futuristic luxury grand tourer. Specifications not validated.",tag:"Fact"},
        {id:uid(),k:"CRIST Chip",v:"Proposed vehicle-control and safety concept. Needs research, engineering and validation.",tag:"Assumption"}]});
let S=DEF();
function load(){try{const s=localStorage.getItem(KEY);if(s)S=Object.assign(DEF(),JSON.parse(s))}catch(e){}}
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Storage full or blocked. Export a backup.")}},120);bell()}
function log(m){S.logs.unshift({t:Date.now(),m});S.logs=S.logs.slice(0,150);save()}
const recs=id=>(S.records[id]=S.records[id]||[]);

/* ============ AI ============ */
const ROLES={
 cofounder:["AI Co-Founder","You are CRIST AI, the founder's honest AI business co-founder for CRIST Motors (concept stage luxury automotive startup). Be strategic, practical, challenge weak ideas."],
 strategy:["Chief Strategy Officer","Act as Chief Strategy Officer. Give structured strategy with risks and alternatives."],
 chief:["Chief of Staff","Act as an executive Chief of Staff. Prioritise, plan the week, be concise."],
 cto:["Chief Technology Officer","Act as an automotive CTO. Be technically honest; flag what needs validation."],
 analyst:["BI Analyst","Act as a business intelligence analyst. Be quantitative and state assumptions."],
 research:["Research Director","Act as a research director. Suggest research questions, methods and credible source types."],
 pm:["Project Manager","Act as a project manager. Give milestones, owners, dependencies."],
 finance:["Finance Advisor","Act as a startup finance advisor. State all numbers as estimates and list assumptions."],
 investor:["Investor Relations","Act as an investor relations advisor. Be honest, never overclaim."],
 product:["Product Strategist","Act as an innovation and product strategist for vehicles and mobility."],
 brand:["Brand Strategist","Act as a luxury brand and marketing strategist."],
 ops:["Operations Advisor","Act as an operations and decision advisor. Compare options and recommend."]};
const RULES=" Rules: CRIST Motors is concept-stage. Never invent facts, funding, partners, revenue, team or technical achievements. Separate Fact / Assumption / Idea / Recommendation. Ask for missing info.";
function snap(){const o=S.tasks.filter(t=>!t.done);return `Data: ${o.length} open tasks (${o.slice(0,4).map(t=>t.title).join("; ")}); ${S.projects.length} projects; ${S.approvals.filter(a=>a.st==="Pending").length} pending approvals.`}
async function callAI(text,role="cofounder",withData=false){
 const r=ROLES[role]||ROLES.cofounder;
 let msg=`[${r[1]}${RULES}]\n${withData?snap()+"\n":""}${text}`;
 if(msg.length>MAXMSG)msg=msg.slice(0,MAXMSG);
 const ac=new AbortController(),to=setTimeout(()=>ac.abort(),50000);
 try{const res=await fetch(S.api,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:msg}),signal:ac.signal});
  const d=await res.json();if(!res.ok||d.error)throw new Error(d.error||("HTTP "+res.status));
  log("AI reply received ("+r[0]+")");return d.reply||"No reply generated."}
 catch(e){throw new Error(e.name==="AbortError"?"The AI took too long. Try a shorter question.":(e.message||"Connection error"))}
 finally{clearTimeout(to)}}

function md(box,text){box.textContent="";box.classList.add("md");let ul=null;
 const inl=(p,s)=>s.split(/\*\*(.+?)\*\*/g).forEach((x,i)=>{if(!x)return;p.append(i%2?h("strong",0,x):document.createTextNode(x.replace(/\*(?=\S)/g,"")))});
 text.split("\n").forEach(l=>{const m=l.match(/^\s*(?:[*\-•]|\d+\.)\s+(.*)/);
  if(m){if(!ul){ul=h("ul");box.append(ul)}const li=h("li");inl(li,m[1]);ul.append(li)}
  else{ul=null;if(!l.trim())return;const hd=l.match(/^#+\s*(.*)/);if(hd)box.append(h("h4",0,hd[1]));else{const p=h("p");inl(p,l);box.append(p)}}})}

/* AI sheet: runs a prompt, shows result, offers save */
function sheet(content,cls){const ov=h("div",{class:"ov "+(cls||""),onclick:e=>{if(e.target===ov)ov.remove()}},h("div",{class:"sheet"},content));document.body.append(ov);return ov}
function aiSheet(title,prompt,role,saveTo){
 const out=h("div",{class:"b a"},h("div",{class:"ty"},h("span"),h("span"),h("span")));
 let txt="";const ov=sheet([h("div",{class:"ch"},title,h("button",{class:"b2",onclick:()=>ov.remove()},"Close")),out,
  h("div",{class:"acts",id:"sa"})]);
 callAI(prompt,role,true).then(r=>{txt=r;md(out,r);
  const a=$("#sa",ov);
  if(saveTo)a.append(h("button",{class:"b2",onclick:()=>{recs(saveTo).unshift({id:uid(),title:title,body:txt,tag:"Recommendation",ai:true,ts:Date.now()});log("Saved AI output to "+saveTo);save();toast("Saved to notes ✓")}},"Save to notes"));
  a.append(h("button",{class:"b2",onclick:()=>copy(txt)},"Copy"));
  a.append(h("p",{class:"rd",style:"width:100%"},"AI-generated. Verify before relying on it."))})
 .catch(e=>{out.textContent="⚠️ "+e.message})}
function copy(t){try{navigator.clipboard.writeText(t);toast("Copied ✓")}catch(e){toast("Select the text to copy")}}

/* ============ MODULES ============ */
const GROUPS=[["Command",["overview","ai","cofounder","strategy","chief"]],["Operations",["tasks","approvals","projects","decisions"]],
 ["Programmes",["gt01","research","tech","aidev","chip","innovation"]],["Business",["bi","finance","investor","brand","expansion"]],
 ["Knowledge",["knowledge","reports"]],["System",["settings"]]];
const M={overview:["Executive Overview","🏠"],ai:["AI Intelligence Centre","🧠"],cofounder:["Business Co-Founder","🤝"],strategy:["Strategy Office","♟️"],chief:["Chief of Staff","📋"],

V.reports=()=>{const w=h("div",{class:"view"},head("reports","Generate, copy and download reports."));const t=reportText();
 w.append(h("div",{class:"card"},h("div",{class:"ch"},"Status report"),h("pre",{class:"rd",style:"white-space:pre-wrap"},t),h("div",{class:"acts"},h("button",{class:"btn",onclick:()=>copy(t)},"Copy"),h("button",{class:"b2",onclick:()=>dl("crist-report.txt",t)},"Download"),h("button",{class:"b2",onclick:()=>aiSheet("Executive summary","Write a 6-line executive summary of this report. "+t.slice(0,1200),"chief","")},"✦ AI summary"))));return w};

/* search palette */
function palette(){const inp=h("input",{placeholder:"Search departments, tasks, notes…",autofocus:true}),res=h("div");let sel=0,items=[];
 const ov=sheet([inp,res],"pal");
 function run(){const q=inp.value.toLowerCase().trim();items=[];
  Object.keys(M).forEach(k=>{if(!q||M[k][0].toLowerCase().includes(q))items.push([M[k][1]+" "+M[k][0],"Go",()=>go(k)])});
  if(q){S.tasks.forEach(t=>{if(t.title.toLowerCase().includes(q))items.push(["✅ "+t.title,"Task",()=>go("tasks")])});
   Object.keys(S.records).forEach(k=>S.records[k].forEach(r=>{if((r.title+r.body).toLowerCase().includes(q))items.push(["📝 "+r.title,M[k][0].split(" ")[0],()=>go(k)])}));
   S.decisions.forEach(d=>{if(d.t.toLowerCase().includes(q))items.push(["⚖️ "+d.t,"Decision",()=>go("decisions")])});
   S.facts.forEach(f=>{if((f.k+f.v).toLowerCase().includes(q))items.push(["📚 "+f.k,"Fact",()=>go("knowledge")])})}
  items=items.slice(0,14);sel=0;res.textContent="";items.forEach((it,i)=>res.append(h("button",{class:"mi"+(i?"":" sel"),onclick:()=>{ov.remove();it[2]()}},it[0],h("small",0,it[1]))));
  if(!items.length)res.append(h("div",{class:"empty"},"No results."))}
 inp.oninput=run;inp.onkeydown=e=>{if(e.key==="Enter"&&items[sel]){ov.remove();items[sel][2]()}};run();setTimeout(()=>inp.focus(),50)}

/* notifications */
function notes(){const n=[],t=today();
 S.tasks.filter(x=>!x.done&&x.due&&x.due<t).forEach(x=>n.push(["⏰ Overdue: "+x.title,"tasks"]));
 S.tasks.filter(x=>!x.done&&x.due===t).forEach(x=>n.push(["📅 Due today: "+x.title,"tasks"]));
 S.approvals.filter(a=>a.st==="Pending").forEach(a=>n.push(["🛡️ Awaiting your approval: "+a.title,"approvals"]));

/* background */
(function(){const c=$("#bgc"),x=c.getContext("2d");let w,hh,P=[];
 function sz(){w=c.width=innerWidth;hh=c.height=innerHeight;P=[];for(let i=0;i<Math.min(55,w*hh/18000|0);i++)P.push({x:Math.random()*w,y:Math.random()*hh,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3})}
 function f(){x.clearRect(0,0,w,hh);if(!S.calm){for(let i=0;i<P.length;i++){const p=P[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>hh)p.vy*=-1;
  x.beginPath();x.arc(p.x,p.y,1.4,0,6.3);x.fillStyle="rgba(44,196,255,.6)";x.fill();
  for(let j=i+1;j<P.length;j++){const q=P[j],dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy);if(d<110){x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.strokeStyle="rgba(44,196,255,"+.2*(1-d/110)+")";x.stroke()}}}}
  requestAnimationFrame(f)}
 addEventListener("resize",sz);sz();f()})();
